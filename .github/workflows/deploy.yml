# Publica a API na Cloudflare depois que o CI da develop passa.
#
# Roda num runner comum do GitHub: o alvo e a Cloudflare, e nao mais a maquina do
# lojista atras do tunel. O deploy pelo tunel continua existindo, manual, no
# deploy.sh do workspace — e o plano B enquanto a migracao nao se prova.
#
# Configuracao unica, antes de ligar: ver cloudflare/README.md.
name: Deploy

on:
  # Depois do CI, e nao em paralelo com ele: merge quebrado nao vai para o ar.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]
  workflow_dispatch: # refazer o deploy sem precisar de um commit novo

concurrency:
  group: deploy-pedeai-api
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publicar:
    # - DEPLOY_AUTOMATICO: variavel do repositorio (Settings > Secrets and variables >
    #   Actions > Variables). Enquanto nao for 'true', o job e PULADO — e o
    #   interruptor que liga o deploy so depois de os segredos existirem.
    # - conclusion == success: CI vermelho nao publica.
    # - event == push: o CI tambem roda em PR, e so o push na develop (o merge) publica.
    if: >-
      vars.DEPLOY_AUTOMATICO == 'true' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          # Num workflow_run o checkout padrao pega a ponta da branch padrao, que
          # pode ja ter andado. Publica exatamente o commit que o CI aprovou.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Conferir os segredos
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          faltando=0
          for nome in DATABASE_URL CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!nome}" ]; then
              echo "::error::Segredo $nome nao configurado no repositorio."
              faltando=1
            fi
          done
          exit $faltando

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            cloudflare/package-lock.json

      - name: Instalar dependências da API
        run: npm ci

      # Antes de publicar o codigo novo, e nao na partida do container: o container
      # dorme e acorda varias vezes por dia, e rodar migrations a cada partida
      # somava segundos a cada acesso. Migration precisa ser compativel com o
      # codigo anterior, que continua no ar ate o passo seguinte terminar.
      - name: Aplicar migrations no Neon
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Instalar o wrangler
        working-directory: cloudflare
        run: npm ci

      - name: Tipos do Worker
        working-directory: cloudflare
        run: npm run tipos

      # Constroi a imagem com o Dockerfile da raiz, envia ao registro da Cloudflare
      # e troca o container.
      - name: Publicar na Cloudflare
        working-directory: cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # "wrangler deploy" terminar nao quer dizer que a API sobe: um container que
      # quebra na partida so apareceria para o primeiro cliente. Confere de ponta a
      # ponta, com mais paciencia que o monitor — a troca do container leva ate um
      # ou dois minutos.
      - name: Conferir a loja no ar
        env:
          TENTATIVAS: '18'
          ESPERA: '10'
        run: bash .github/scripts/verificar-producao.sh
