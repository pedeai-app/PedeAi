# Confere varias vezes ao dia se a loja esta no ar: site, API e banco.
#
# O aviso e o e-mail que o GitHub manda quando uma rodada falha (Settings >
# Notifications > Actions no perfil de quem recebe).
#
# Por que 3 vezes ao dia e nao a cada 5 minutos: toda checagem na API acorda o
# container, que fica ligado (e cobrando) por 30 min. Checar sem parar o manteria
# ligado o mes inteiro. Deploy quebrado nao espera a proxima rodada: o deploy.yml
# roda a mesma checagem logo depois de publicar.
name: Monitor

on:
  schedule:
    # Acompanha o horario da loja, que abre por volta das 13h30 nos dias de semana:
    # 13h (antes de abrir, da tempo de corrigir), 17h e 21h em Brasilia (UTC-3).
    # Roda todo dia, fim de semana inclusive. O GitHub pode atrasar alguns minutos.
    - cron: '0 16,20,0 * * *'
  workflow_dispatch:

concurrency:
  group: monitor
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Site, API e banco
        run: bash .github/scripts/verificar-producao.sh
