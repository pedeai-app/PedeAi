# Confere varias vezes ao dia se a loja esta no ar: site, API e banco.
#
# O aviso e o e-mail que o GitHub manda quando uma rodada falha (Settings >
# Notifications > Actions no perfil de quem recebe).
#
# Por que 5 vezes ao dia e nao a cada 5 minutos: toda checagem na API acorda o
# container, que fica ligado (e cobrando) por 30 min. Checar sem parar o manteria
# ligado o mes inteiro. Nestes horarios o custo e de centavos, e cai quase todo
# dentro do uso que a loja ja faria. Deploy quebrado nao espera a proxima rodada:
# o deploy.yml roda a mesma checagem logo depois de publicar.
name: Monitor

on:
  schedule:
    # 09h, 12h, 15h, 18h e 21h em Brasilia (UTC-3). O GitHub pode atrasar alguns
    # minutos rodadas agendadas.
    - cron: '0 12,15,18,21,0 * * *'
  workflow_dispatch:

concurrency:
  group: monitor
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Site, API e banco
        run: bash .github/scripts/verificar-producao.sh
